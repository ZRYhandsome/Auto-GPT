<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>座次桌签</title>
<meta name="description" content="粘贴名单，自动排会议座次，一键打印双面桌签。名单只在本机处理和保存。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23b91c1c%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2246%22%20width%3D%2248%22%20height%3D%225%22%20rx%3D%222.5%22%20fill%3D%22%23f6c453%22%2F%3E%3Cpath%20d%3D%22M14%2020%20L50%2020%20L52%2046%20L12%2046%20Z%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M15%2016%20L49%2016%20L50%2020%20L14%2020%20Z%22%20fill%3D%22%23f3d4d4%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2227%22%20width%3D%227.5%22%20height%3D%229%22%20rx%3D%221.2%22%20fill%3D%22%23b91c1c%22%2F%3E%3Crect%20x%3D%2228.25%22%20y%3D%2227%22%20width%3D%227.5%22%20height%3D%229%22%20rx%3D%221.2%22%20fill%3D%22%23b91c1c%22%2F%3E%3Crect%20x%3D%2237.5%22%20y%3D%2227%22%20width%3D%227.5%22%20height%3D%229%22%20rx%3D%221.2%22%20fill%3D%22%23b91c1c%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2239%22%20width%3D%2220%22%20height%3D%222.4%22%20rx%3D%221.2%22%20fill%3D%22%23e8b4b4%22%2F%3E%3C%2Fsvg%3E">
<style>
:root {
  --bg: #f4f3ef;
  --bg-soft: #faf9f6;
  --panel: #ffffff;
  --text: #1c1f24;
  --muted: #6b6f76;
  --line: #e7e3da;
  --line-strong: #d3cdbf;
  --hover: #f5f3ee;
  --chip: #f0ede5;
  --accent: #b91c1c;
  --accent-weak: #fdeeee;
  --accent-text: #ffffff;
  --link: #1d4ed8;
  --focus: #2563eb;
  --guest: #1d4ed8;
  --guest-weak: #e8efff;
  --ok: #15803d;
  --ok-weak: #e6f5eb;
  --warn: #a14a05;
  --warn-weak: #fff3df;
  --shadow-sm: 0 1px 2px rgba(30, 25, 15, .06);
  --shadow: 0 2px 6px rgba(30, 25, 15, .07), 0 10px 28px rgba(30, 25, 15, .08);
  --cover: rgba(255, 255, 255, .9);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151619;
    --bg-soft: #1a1b1f;
    --panel: #212327;
    --text: #e9e7e2;
    --muted: #a0a4ab;
    --line: #33363c;
    --line-strong: #4a4e56;
    --hover: #2a2d32;
    --chip: #2b2e33;
    --accent: #e5484d;
    --accent-weak: #3a1f21;
    --accent-text: #ffffff;
    --link: #8ab4ff;
    --focus: #6ea2ff;
    --guest: #9dbcff;
    --guest-weak: #1f2b45;
    --ok: #57d38c;
    --ok-weak: #18301f;
    --warn: #f0b35a;
    --warn-weak: #3a2c14;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow: 0 2px 6px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    --cover: rgba(21, 22, 25, .9);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }
kbd {
  display: inline-block; min-width: 20px; padding: 0 5px; font: 600 12px/1.6 inherit; text-align: center;
  background: var(--panel); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--text);
}

/* ---------- 按钮和输入框 ---------- */
button {
  font: inherit; font-size: 14px; line-height: 1.3;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .42; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.danger { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--chip); }
button.link { border: 0; background: none; padding: 0; color: var(--link); gap: 3px; }
button.link:hover:not(:disabled) { background: none; text-decoration: underline; }
.icon-btn { padding: 6px; border-color: transparent; background: transparent; color: var(--text); }
.icon-btn:hover:not(:disabled) { background: var(--chip); }
.danger-ghost { color: var(--accent); }
.ic { flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
select, input.num, .date-input {
  font: inherit; font-size: 13.5px; color: var(--text); background: var(--panel);
  border: 1px solid var(--line-strong); border-radius: 7px; padding: 4px 6px;
}
input.num { width: 64px; }
textarea {
  width: 100%; min-height: 240px; resize: vertical;
  font: 13.5px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
  color: var(--text); background: var(--bg-soft);
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; tab-size: 10;
}
textarea.short { min-height: 110px; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 13px; color: var(--muted); }
.seg button:hover:not(:disabled) { background: transparent; color: var(--text); }
.seg button[aria-checked="true"], .seg button[aria-selected="true"] {
  background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line);
}
.pill {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px;
  font-size: 12px; background: var(--chip); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: var(--ok-weak); color: var(--ok); }
.pill.new { background: var(--warn-weak); color: var(--warn); font-weight: 600; }
.tag { display: inline-block; padding: 0 8px; border-radius: 10px; background: var(--chip); font-size: 12px; }
.tag.guest { background: var(--guest-weak); color: var(--guest); font-weight: 600; }

/* ---------- 首页 ---------- */
.home { max-width: 1060px; margin: 0 auto; padding: 32px 24px 40px; }
.home-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.brand { display: flex; gap: 14px; align-items: center; }
.logo { width: 52px; height: 52px; flex: none; border-radius: 14px; box-shadow: var(--shadow-sm); }
.logo svg { display: block; width: 100%; height: 100%; }
.brand h1 { font-size: 25px; margin: 0; letter-spacing: .08em; }
.brand p { margin: 2px 0 0; color: var(--muted); }
.home-tools { display: flex; gap: 6px; }
.home h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .04em; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile {
  display: flex; gap: 14px; align-items: center; text-align: left; white-space: normal;
  padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); background: var(--panel); }
.tile svg { flex: none; }
.tile b { font-size: 17px; display: block; margin-bottom: 3px; }
.tile-text > span { color: var(--muted); font-size: 13px; line-height: 1.5; }
.drop-tip { display: flex; gap: 6px; align-items: center; margin: 12px 2px 0; }
.recent { margin-top: 34px; }
.recent-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.recent-head h2 { margin: 0; }
.search {
  display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 0 10px; background: var(--panel); color: var(--muted);
}
.search input { border: 0; background: transparent; padding: 6px 0; font: inherit; color: var(--text); outline: none; width: 220px; }
.mlist { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
.mrow { display: flex; align-items: center; gap: 2px; padding-right: 10px; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mopen { flex: 1; display: flex; gap: 14px; align-items: center; border: 0; border-radius: 0; background: transparent; padding: 10px 16px; text-align: left; min-width: 0; }
.mopen:hover:not(:disabled) { background: transparent; }
.mrow:hover { background: var(--hover); }
.mmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.mmain b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.mmain .muted { font-size: 12.5px; }
.mtime { font-size: 12.5px; }
.mrow .icon-btn { color: var(--muted); }
.mempty { padding: 34px 20px; text-align: center; }
.mempty p { margin: 4px 0; }
.home-foot { margin-top: 30px; text-align: center; }
.home.filedrag::after {
  content: "松开鼠标，用这份名单新建一场会议"; position: fixed; inset: 14px; z-index: 50;
  border: 3px dashed var(--focus); border-radius: 18px; background: var(--cover);
  display: grid; place-items: center; font-size: 20px; color: var(--focus); pointer-events: none;
}

/* ---------- 编辑页 ---------- */
.editor { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
.bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
}
.bar-back { border-color: transparent; background: transparent; padding: 6px 8px 6px 4px; color: var(--muted); }
.bar-back:hover:not(:disabled) { color: var(--text); background: var(--chip); }
.bar-title { flex: 1 1 260px; display: flex; gap: 8px; align-items: center; min-width: 160px; }
.title-input {
  flex: 0 1 auto; field-sizing: content; min-width: 14em; max-width: 100%; font: 600 17px/1.3 inherit; color: var(--text); background: transparent;
  border: 1px solid transparent; border-radius: 8px; padding: 5px 8px;
}
.title-input:hover { border-color: var(--line); }
.title-input:focus { border-color: var(--focus); background: var(--panel); outline: none; }
.title-input::placeholder { color: var(--muted); font-weight: 400; }
.date-input { color: var(--muted); border-color: transparent; background: transparent; }
.date-input:hover, .date-input:focus { border-color: var(--line-strong); }
.bar-right { display: flex; gap: 4px; align-items: center; flex: none; }
.bar-right .primary { margin-left: 4px; }
.saved { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; white-space: nowrap; }
.saved.ok { color: var(--ok); }
.saved.bad { color: var(--accent); font-weight: 600; }

.work { display: grid; grid-template-columns: minmax(460px, 44%) 1fr; gap: 12px; padding: 12px; min-height: 0; }
.pane {
  display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm);
}
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pane-head h2 { font-size: 16px; margin: 0; }
.count { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 13px; }
.pane-tools { display: flex; gap: 6px; }

.sortbar { display: flex; gap: 6px 12px; align-items: center; padding: 8px 16px 0; font-size: 12.5px; flex-wrap: wrap; }
.sortbar:empty { display: none; }
.sort-state { display: inline-flex; gap: 4px; align-items: center; color: var(--ok); font-weight: 600; }
.sort-state.manual { color: var(--warn); }
.sortbar .muted { display: inline-flex; align-items: center; gap: 2px; }
.sortbar .link { font-size: 12.5px; }
.checks { padding: 6px 12px 0; }
.checks:empty { display: none; }
.check-item { display: flex; gap: 6px; align-items: flex-start; background: var(--warn-weak); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-bottom: 6px; }
.check-item .ic { margin-top: 2px; }
.roster-scroll { flex: 1; overflow: auto; padding: 4px 8px 10px; min-height: 0; }

table.roster { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.roster th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 6px 7px; border-bottom: 1px solid var(--line); }
.roster td { padding: 2px 3px; border-bottom: 1px solid var(--line); vertical-align: middle; height: 40px; }
.roster th.c-no { width: 62px; padding-left: 26px; }
.editor[data-type="round"] .roster th.c-no { width: 82px; }
.roster th.c-name { width: 96px; }
.roster th.c-title { width: 36%; }
.roster th.c-side { width: 48px; text-align: center; }
.roster th.c-x { width: 32px; }
.editor[data-type="podium"] .c-side { display: none; }
.roster td.c-no { white-space: nowrap; }
.grip { display: inline-flex; vertical-align: middle; cursor: grab; color: var(--muted); opacity: .35; padding: 6px 3px; border-radius: 4px; }
.roster tr:hover .grip { opacity: 1; }
.grip:active { cursor: grabbing; }
.no { display: inline-block; vertical-align: middle; min-width: 24px; text-align: center; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.editor[data-type="round"] .no { font-size: 12.5px; text-align: left; }
.cell {
  width: 100%; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 6px 6px; font: inherit; color: inherit; text-overflow: ellipsis;
}
.cell::placeholder { color: var(--line-strong); }
.cell:hover { border-color: var(--line); background: var(--panel); }
.cell:focus { border-color: var(--focus); background: var(--panel); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.c-name .cell { font-weight: 600; }
.c-unit .cell, .c-title .cell { color: var(--text); }
td.c-side { text-align: center; }
.side { padding: 2px 0; width: 32px; justify-content: center; border-radius: 12px; font-size: 12.5px; background: var(--chip); border-color: var(--line); }
.side.guest { background: var(--guest-weak); color: var(--guest); border-color: transparent; font-weight: 700; }
.x { opacity: 0; padding: 5px; border-color: transparent; background: transparent; color: var(--muted); }
.roster tr:hover .x, .x:focus-visible { opacity: 1; }
.x:hover:not(:disabled) { color: var(--accent); background: var(--accent-weak); }
.roster tr.sel td { background: var(--accent-weak); }
.roster tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.roster tr.flash td { animation: flash 1.3s ease-out; }
@keyframes flash { 0%, 30% { background: #fde68a; } 100% { background: transparent; } }
.roster tr.grp td { background: var(--chip); font-size: 13px; padding: 6px 10px; height: auto; border-bottom: 0; }
.roster tbody:not(:first-of-type) tr.grp td { border-top: 10px solid var(--panel); }
.roster tr.grp b { margin-right: 8px; }
.roster tr.grp-empty td { color: var(--muted); font-size: 12.5px; padding: 12px; height: auto; white-space: normal; }
.roster tr.addrow td { border-bottom: 0; height: auto; padding: 6px 10px 4px; }
.roster tr.addrow .link { font-size: 13px; }
.roster tr.drop-before td { box-shadow: inset 0 3px 0 var(--focus); }
.roster tr.drop-after td { box-shadow: inset 0 -3px 0 var(--focus); }
.roster tbody.drop-into tr.grp td { box-shadow: inset 0 0 0 2px var(--focus); }
.roster tr.dragging td { opacity: .35; }

.empty-roster { text-align: center; padding: 36px 24px 30px; color: var(--muted); border: 2px dashed var(--line-strong); border-radius: 16px; margin: 10px 4px; }
.empty-roster h3 { color: var(--text); font-size: 19px; margin: 10px 0 6px; }
.empty-roster p { margin: 6px 0; line-height: 1.8; }
.row-center { display: flex; gap: 10px; justify-content: center; margin: 18px 0 12px; flex-wrap: wrap; }
.dropcover {
  position: absolute; inset: 0; display: none; place-items: center; align-content: center; gap: 10px; z-index: 5;
  background: var(--cover); border: 3px dashed var(--focus); border-radius: 14px; color: var(--focus); font-size: 17px; pointer-events: none;
}
.roster-pane.filedrag .dropcover { display: grid; }

.view-tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; }
.view-tools > label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.view-tools .link { font-size: 13px; }
.editor:not([data-type="podium"]) .only-podium,
.editor:not([data-type="facing"]) .only-facing,
.editor:not([data-type="round"]) .only-round,
.editor[data-type="round"] .not-round,
.editor:not([data-preset="custom"]) .only-custom,
.editor[data-tab="chart"] .for-cards,
.editor[data-tab="cards"] .for-chart { display: none !important; }
.view { flex: 1; overflow: auto; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-soft); border-radius: 0 0 14px 14px; }
.chart-stage {
  flex: 1 0 auto; display: flex; align-items: center; justify-content: center; min-height: 320px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; user-select: none; -webkit-user-select: none;
}
.chart-stage svg { max-width: 100%; height: auto; }
#e-chart g.seat { cursor: grab; }
#e-chart g.seat:not(.selected):hover .seat-box { stroke: #2563eb; stroke-width: 2; }
#e-chart g.seat.lifted { opacity: .35; }
#e-chart g.seat.target .seat-box { stroke: #2563eb; stroke-width: 3.5; fill: #dbeafe; }
.chart-stage.swapping g.seat { cursor: crosshair !important; }
.chart-stage.swapping { box-shadow: inset 0 0 0 3px #93c5fd; }
.seat-ghost {
  position: fixed; left: 0; top: 0; pointer-events: none; z-index: 1000;
  background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: 700; box-shadow: var(--shadow);
}
.selbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 6px 12px; box-shadow: var(--shadow-sm);
}
.selbar .who { margin-right: auto; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.selbar .who b { font-size: 15px; }
.selbar button { padding: 4px 10px; font-size: 13px; }
.swap-tip { margin-right: auto; display: inline-flex; gap: 6px; align-items: center; color: var(--focus); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hint > span:first-child { display: inline-flex; gap: 6px; align-items: center; }
.zoom { display: inline-flex; align-items: center; gap: 2px; }
.zoom .icon-btn { padding: 1px 7px; font-size: 14px; color: var(--muted); }
.zoom .link { font-size: 12.5px; color: var(--muted); min-width: 56px; justify-content: center; }
.chart-stage.zoomed { justify-content: flex-start; align-items: flex-start; }
.chart-stage.zoomed svg { margin: auto; }
.view-empty { margin: auto; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 8px; padding: 40px; }
.chart-stage .view-empty { color: #6b6f76; }

.cards-sum { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.cards-sum:empty { display: none; }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; align-content: start; }
.sheet { margin: 0; cursor: pointer; }
.paper { background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .22), 0 0 0 1px rgba(0, 0, 0, .04); border-radius: 2px; overflow: hidden; }
.paper svg { display: block; width: 100%; height: 100%; }
.sheet:hover .paper { box-shadow: 0 2px 10px rgba(0, 0, 0, .22); }
.sheet.sel .paper { outline: 3px solid var(--accent); outline-offset: 2px; }

<body>
<div id="app" class="app"></div>
<div id="print-root" aria-hidden="true"></div>
<noscript><p style="padding:24px">座次桌签需要启用 JavaScript 才能使用。</p></noscript>
<script>
"use strict";
const __mod_store = (() => {
// 会议保存在本机：浏览器的 localStorage（桌面版里也是，数据在软件自己的目录里）。
// 每场会议一个键，另有一份目录方便列出；还可以整体导出、导入备份文件，换电脑时用。
const INDEX = 'seatcard.meetings';
const PREFIX = 'seatcard.meeting.';
const PREFS = 'seatcard.prefs';

function memoryStorage() {
  const m = new Map();
  return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) };
}

function createStore(storage) {
  const get = (k, fallback) => {
    try {
      const v = storage.getItem(k);
      return v ? JSON.parse(v) : fallback;
    } catch (e) {
      return fallback;
    }
  };
  const set = (k, v) => {
    try {
      storage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      return false;
    }
  };
  // 目录里带上人名，首页可以按人名搜到会议
  const summary = (m) => {
    const names = m.people.map((p) => p.name).filter(Boolean);
    return { id: m.id, title: m.title, type: m.type, date: m.date, count: names.length, names: names.slice(0, 120).join(' '), updatedAt: m.updatedAt };
  };
  return {
    list() {
      return get(INDEX, []).sort((a, b) => b.updatedAt - a.updatedAt);
    },
    load(id) {
      return get(PREFIX + id, null);
    },
    save(m) {
      m.updatedAt = Date.now();
      const ok = set(PREFIX + m.id, m);
      const idx = get(INDEX, []).filter((x) => x.id !== m.id);
      idx.push(summary(m));
      return set(INDEX, idx) && ok;
    },
    remove(id) {
      try { storage.removeItem(PREFIX + id); } catch (e) { /* 忽略 */ }
      set(INDEX, get(INDEX, []).filter((x) => x.id !== id));
    },
    prefs() {
      return get(PREFS, {});
    },
    savePrefs(p) {
      set(PREFS, { ...get(PREFS, {}), ...p });
    },
    exportAll() {
      const meetings = get(INDEX, []).map((x) => get(PREFIX + x.id, null)).filter(Boolean);
      return JSON.stringify({ app: 'seatcard', version: 1, exportedAt: new Date().toISOString(), meetings }, null, 1);
    },
    /** 导入备份：同一场会议（同 id）以修改时间新的为准。返回导入的场数。 */
    importAll(json) {
      const data = JSON.parse(json);
      if (!data || data.app !== 'seatcard' || !Array.isArray(data.meetings)) throw new Error('这不是座次桌签的备份文件');
      let n = 0;
      for (const m of data.meetings) {
        if (!m || !m.id || !Array.isArray(m.people)) continue;
        const cur = get(PREFIX + m.id, null);
        if (cur && cur.updatedAt >= m.updatedAt) continue;
        const stamp = m.updatedAt;
        set(PREFIX + m.id, m);
        const idx = get(INDEX, []).filter((x) => x.id !== m.id);
        idx.push({ ...summary(m), updatedAt: stamp });
        set(INDEX, idx);
        n++;
      }
      return n;
    },
  };
}

return { memoryStorage, createStore };
})();

const __mod_parse = (() => {
// 名单解析：把从 Excel、Word、微信里复制来的名单拆成 { name, title, unit, side }。
// 支持的写法：
//   张三<Tab>局长<Tab>财政局          （从 Excel 复制，最常见）
//   张三，局长，财政局 / 张三、局长      （中英文逗号、顿号、分号）
//   张 三  局长  财政局               （空格分隔；两字名中间常加空格对齐，会自动合并）
// 前几行里如果有"姓名 职务 单位"这样的表头，按表头识别列，表头上面的标题行跳过；第四列"主/客"用于会谈排座。
// 没有表头时，第一列是"1、2、3"这样的序号会自动去掉。

const HEADER = {
  name: /^(姓名|名字|人员|领导|参会人员|出席人员|参会领导|出席领导|嘉宾|嘉宾姓名|领导姓名)$/,
  title: /^(职务|职位|职称|头衔|职级)$/,
  unit: /^(单位|部门|工作单位|所在单位)$/,
  side: /^(主客|主\/客|方|身份|类别|主方客方|主宾|宾主)$/,
};
// "姓 名""职务（职级）"这样的表头：去掉空格和括号里的说明再比
const headKey = (h) => String(h).replace(/[\s　]+/g, '').replace(/[(（][^)）]*[)）]/g, '');
const CJK1 = /^[一-鿿]$/;
const SERIAL = /^(\d{1,3}|[(（]?\d{1,3}[)）.、．]?)$/;
// 表格标题："XX会议参会人员名单"之类，没有表头时也要跳过
const TITLE_LINE = /(名单|名册|座次|安排|一览|参会|出席|会议|统计)/;

function splitLine(line) {
  if (line.includes('\t')) return line.split('\t').map((s) => s.trim());
  if (/[，,、;；|｜]/.test(line)) return line.split(/[，,、;；|｜]/).map((s) => s.trim());
  const parts = line.trim().split(/\s+/);
  // "张 三 局长"：前两段都是单个汉字，是被空格隔开的两字名
  if (parts.length >= 2 && CJK1.test(parts[0]) && CJK1.test(parts[1])) parts.splice(0, 2, parts[0] + parts[1]);
  return parts;
}

function normalizeSide(v) {
  const s = String(v || '').trim();
  if (/^(客|客方|来宾|宾|对方|外方|客人)$/.test(s)) return 'guest';
  if (/^(主|主方|我方|东道主|中方)$/.test(s)) return 'host';
  return '';
}

/** "陈  平"→"陈平"（汉字之间的对齐空格去掉）；外文名里的空格保留一个。 */
function cleanName(s) {
  return String(s || '').replace(/[\s　]+/g, ' ').trim().replace(/([一-鿿·])\s+(?=[一-鿿·])/g, '$1');
}

function parseRoster(text) {
  let lines = String(text || '').split(/\r?\n/).map((l) => l.replace(/\u00a0/g, ' ')).filter((l) => l.trim());
  const warnings = [];
  if (!lines.length) return { people: [], warnings };
  let cols = { name: 0, title: 1, unit: 2, side: 3 };
  const headAt = lines.slice(0, 6).findIndex((l) => splitLine(l).some((h) => HEADER.name.test(headKey(h))));
  let start = 0;
  if (headAt >= 0) {
    const head = splitLine(lines[headAt]);
    cols = { name: -1, title: -1, unit: -1, side: -1 };
    head.forEach((h, i) => { for (const k of Object.keys(HEADER)) if (cols[k] < 0 && HEADER[k].test(headKey(h))) cols[k] = i; });
    start = headAt + 1;
  } else {
    while (start < Math.min(lines.length - 1, 2) && splitLine(lines[start]).filter(Boolean).length === 1 && TITLE_LINE.test(lines[start]) && [...lines[start].trim()].length > 6) start++;
  }
  lines = lines.slice(start);
  // 没有表头、第一列是序号：整列去掉
  const rows = lines.map(splitLine);
  const serial = headAt < 0 && rows.length && rows.filter((r) => r.length > 1 && SERIAL.test(r[0])).length >= Math.max(1, rows.length * 0.6);
  const people = [];
  const seen = new Map();
  rows.forEach((raw, i) => {
    const parts = serial && SERIAL.test(raw[0]) ? raw.slice(1) : raw;
    const pick = (k) => (cols[k] >= 0 && cols[k] < parts.length ? parts[cols[k]] : '');
    const name = cleanName(pick('name'));
    if (!name || SERIAL.test(name)) return;
    let unit = pick('unit');
    let side = normalizeSide(pick('side'));
    // 没有表头时，第三列也可能直接写了"主/客"
    if (!side && cols.side === 3 && normalizeSide(unit) && parts.length === 3) { side = normalizeSide(unit); unit = ''; }
    const person = { id: people.length, name, title: pick('title'), unit, side: side || 'host', order: people.length };
    if (seen.has(name)) warnings.push(`第 ${start + i + 1} 行的"${name}"和前面重名，请确认是不是重复粘贴了`);
    seen.set(name, true);
    people.push(person);
  });
  return { people, warnings };
}

return { normalizeSide, cleanName, parseRoster };
})();

const __mod_rank = (() => {
// 按职务粗排位次。规则写得很直白，排完可以手动上下调：
//   1. 职务里写了级别（正厅、副处、正科……）的按级别，排在最前；
//   2. 地方党政领导（省、市、县、区、乡镇的书记、正副职，人大、政协负责人）排在部门领导前：
//      副市长是副厅级，市里的局长是正处级；
//   3. 部门领导按层级：部、厅 > 局 > 处 > 科 > 股，同层级正职在副职前；
//      主任、经理、院长、校长等看不出层级的，按局一级算；
//   4. 再往后是秘书长、助理、调研员等其他职务，最后是没写职务的；
//   5. 分数相同时：先按"单位顺序"（如果填了），再把书记排在同单位行政正职前（可关），最后按粘贴顺序。
// "党组书记、局长"这种兼任，取其中最高的一个。

// "副处长""副科长"是职务不是级别，所以级别词后面不能跟"长""员"
const lv = (word, alt) => new RegExp(`${word}(级|(?![长员]))|${alt}`);
const LEVELS = [
  [lv('正部', '省部级正职'), -10, '正部级'], [lv('副部', '省部级副职'), -9, '副部级'],
  [lv('正厅', '厅局级正职'), -8, '正厅级'], [lv('副厅', '厅局级副职'), -7, '副厅级'],
  [lv('正处', '县处级正职'), -6, '正处级'], [lv('副处', '县处级副职'), -5, '副处级'],
  [lv('正科', '乡科级正职'), -4, '正科级'], [lv('副科', '乡科级副职'), -3, '副科级'],
];
const PLACE = '(省|市|州|盟|县|区|旗|镇|乡)';
const LOCAL_SECRETARY = new RegExp(`${PLACE}委(副)?书记$`);
const LOCAL_HEAD = new RegExp(`^(常务)?(副)?${PLACE}长$`);
const LOCAL_CONGRESS = /(人大(常委会)?(副)?主任|政协(副)?主席)$/;
const LOCAL_DISCIPLINE = new RegExp(`${PLACE}(纪委|监委)(副)?书记$`);
// "销售总监""部门经理"在总经理、副总经理之后，按其他职务算
const OTHER = /(秘书长|助理|调研员|巡视员|总师|总经济师|总会计师|总工程师|主任科员|科员|干事|专员|委员|成员|(?<!总)经理|总监|(团委|团工委|支部|总支|工会)(副)?(书记|主席))$/;
const LADDER = [[/(部长|厅长)$/, 0], [/局长$/, 1], [/处长$/, 2], [/科长$/, 3], [/股长$/, 4]];
const LADDER_NAME = ['部厅', '局', '处', '科', '股'];
const HEAD = /(长|主任|董事长|总经理|主席|会长|理事长|总裁|行长|社长|所长|馆长|院长|校长|站长|队长|主编|主委|政委)$/;

function roleScore(role, partyFirst) {
  const r = role.trim();
  if (!r) return { score: 50, label: '未识别', party: false };
  const deputy = /副/.test(r);
  if (LOCAL_DISCIPLINE.test(r)) return { score: 3, label: '地方副职', party: false };
  if (LOCAL_SECRETARY.test(r)) return deputy ? { score: 2, label: '地方副书记', party: false } : { score: 0, label: '地方书记', party: true };
  if (LOCAL_HEAD.test(r) || LOCAL_CONGRESS.test(r)) return deputy ? { score: 3, label: '地方副职', party: false } : { score: 1, label: '地方正职', party: false };
  if (OTHER.test(r)) return { score: 30, label: '其他职务', party: false };
  if (/(纪委|纪检|纪工委|监委)(副)?书记$/.test(r)) return { score: 13, label: '副职', party: false };
  if (/书记$/.test(r)) return { score: 12 + (deputy ? 1 : 0), label: deputy ? '副书记' : '书记', party: !deputy && partyFirst };
  for (const [rx, step] of LADDER) {
    if (rx.test(r)) return { score: 10 + step * 2 + (deputy ? 1 : 0), label: `${deputy ? '副职' : '正职'}·${LADDER_NAME[step]}`, party: false };
  }
  if (HEAD.test(r)) return { score: 12 + (deputy ? 1 : 0), label: deputy ? '副职' : '正职', party: false };
  return { score: 40, label: '未识别', party: false };
}

function rankOf(title, { partyFirst = true } = {}) {
  const t = String(title || '');
  for (const [rx, level, label] of LEVELS) if (rx.test(t)) return { score: level, label, party: false };
  const roles = t.split(/[、,，/／;；\s]+/).filter(Boolean);
  let best = roleScore('', partyFirst);
  for (const r of roles) {
    const s = roleScore(r, partyFirst);
    if (s.score < best.score || (s.score === best.score && s.party)) best = s;
  }
  return best;
}

function sortByRank(people, { unitOrder = [], partyFirst = true } = {}) {
  const unitIdx = new Map();
  unitOrder.map((u) => u.trim()).filter(Boolean).forEach((u, i) => { if (!unitIdx.has(u)) unitIdx.set(u, i); });
  const unitKey = (p) => (unitIdx.has(p.unit) ? unitIdx.get(p.unit) : unitOrder.length);
  return people
    .map((p) => ({ p, r: rankOf(p.title, { partyFirst }) }))
    .sort((a, b) => a.r.score - b.r.score
      || unitKey(a.p) - unitKey(b.p)
      || (a.p.unit && a.p.unit === b.p.unit ? Number(b.r.party) - Number(a.r.party) : 0)
      || a.p.order - b.p.order)
    .map((x) => x.p);
}

return { rankOf, sortByRank };
})();

const __mod_round = (() => {
// 圆桌宴请。座位从正对门的位置（主位）开始顺时针编号 0..n-1，门在下方。
// 中式宴请一般"以右为尊"：主宾坐在主人右手。围桌而坐的人都面朝桌心，所以每个人的右手边
// 都在逆时针方向：主位的右手边是编号 n-1（图上左侧），对面副陪的右手边是 opp-1（图上右侧）。
//
// 两种常见坐法：
//   pair（主副陪，北方常见）：主陪面门坐主位，副陪背门坐对面；主宾在主陪右手、副主宾在主陪左手，
//     三宾在副陪右手、四宾在副陪左手；其余宾主从靠近主位的座位起，宾、陪交替往下坐。
//   single（主人居中）：主人坐主位，客人按主宾、第二宾……在主人右、左交替往下坐，陪同人员坐剩下的位置。
// rule = 'left' 时左右对调。排出来只是起点，可以拖动互换。

function roundTable(hosts, guests, { size = 10, scheme = 'pair', rule = 'right' } = {}) {
  const total = hosts.length + guests.length;
  const n = Math.max(size, total, 2);
  const seat = new Array(n).fill(null);
  // 尊位一侧的方向：以右为尊时往逆时针方向走（-1）
  const honorStep = rule === 'right' ? -1 : 1;
  const at = (s) => ((s % n) + n) % n;
  const place = (s, person, side, rank) => { seat[at(s)] = { person, side, rank }; };
  const free = (s) => seat[at(s)] === null;
  const opp = Math.floor(n / 2);
  const hostQ = hosts.map((p, i) => ({ person: p, side: 'host', rank: i }));
  const guestQ = guests.map((p, i) => ({ person: p, side: 'guest', rank: i }));

  // 主位附近、按尊卑排好的空座：主位右 1、左 1、右 2、左 2……
  const honorOrder = () => {
    const out = [];
    const r = honorStep;
    for (let k = 1; k < n; k++) {
      for (const s of [at(r * k), at(-r * k)]) if (!out.includes(s) && s !== 0) out.push(s);
    }
    return out;
  };

  if (hostQ.length) { const h = hostQ.shift(); place(0, h.person, h.side, h.rank); }
  else if (guestQ.length) { const g = guestQ.shift(); place(0, g.person, g.side, g.rank); }

  if (scheme === 'pair') {
    if (hostQ.length) { const h = hostQ.shift(); place(opp, h.person, h.side, h.rank); }
    const r = honorStep;
    const targets = [at(r), at(-r), at(opp + r), at(opp - r)];
    for (const s of targets) {
      if (!guestQ.length) break;
      if (!free(s)) continue;
      const g = guestQ.shift();
      place(s, g.person, g.side, g.rank);
    }
    // 其余宾、陪交替
    const rest = [];
    while (guestQ.length || hostQ.length) {
      if (guestQ.length) rest.push(guestQ.shift());
      if (hostQ.length) rest.push(hostQ.shift());
    }
    for (const s of honorOrder()) {
      if (!rest.length) break;
      if (!free(s)) continue;
      const x = rest.shift();
      place(s, x.person, x.side, x.rank);
    }
  } else {
    const rest = [...guestQ, ...hostQ];
    for (const s of honorOrder()) {
      if (!rest.length) break;
      if (!free(s)) continue;
      const x = rest.shift();
      place(s, x.person, x.side, x.rank);
    }
  }
  return {
    kind: 'round', n, scheme, rule, overflow: total > size,
    seats: seat.map((x, s) => ({ seat: s, ...(x || { person: null, side: '', rank: -1 }) })),
  };
}

/** 一排 n 个座位里，第 k 个人坐在哪：返回就座者视角下从左数的下标（0..n-1）。 */
function centerOrder(n, rule = 'left') {

/** 三种会议的小示意图，用在首页和会议列表。 */

// ---------- 提示条 ----------
let toastBox = null;
/** 换页面时清掉提示条：上面的"撤销"只对原来那一页有效。 */
function clearToasts() {
  if (toastBox) toastBox.innerHTML = '';
}
function toast(message, { action = '', onAction = null, timeout = 4500, kind = '' } = {}) {
  if (!toastBox) {
    toastBox = document.createElement('div');
    toastBox.className = 'toasts';
    toastBox.setAttribute('role', 'status');
    toastBox.setAttribute('aria-live', 'polite');
    document.body.appendChild(toastBox);
  }
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<span>${esc(message)}</span>${action ? `<button type="button" class="toast-act">${esc(action)}</button>` : ''}`;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 200); };
  if (action) el.querySelector('.toast-act').addEventListener('click', () => { close(); if (onAction) onAction(); });
  toastBox.appendChild(el);
  while (toastBox.children.length > 3) toastBox.firstChild.remove();
  setTimeout(close, timeout);
  return close;
}

// ---------- 对话框 ----------
/**
 * 打开一个模态对话框。buttons: [{ label, value, kind:'primary'|'danger'|'', id }]
 * onMount(dialog, close) 里可以绑定事件；返回 Promise，点哪个按钮就得到哪个 value，关掉得到 null。
 */
function openDialog({ title, body = '', buttons = [{ label: '好', value: true, kind: 'primary' }], onMount = null, className = '' }) {
  return new Promise((resolve) => {
    const dlg = document.createElement('dialog');
    dlg.className = `dlg ${className}`;
    dlg.innerHTML = `<form method="dialog" class="dlg-form">
  <header class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn dlg-x" aria-label="关闭">${icon('x')}</button></header>
  <div class="dlg-body">${body}</div>
  <footer class="dlg-foot">${buttons.map((b, i) => `<button type="button" class="${b.kind || ''}" data-i="${i}"${b.id ? ` id="${b.id}"` : ''}>${esc(b.label)}</button>`).join('')}</footer>
</form>`;
    document.body.appendChild(dlg);
    let result = null;
    const close = (value = null) => {
      result = value;
      if (dlg.open) dlg.close();
    };
    dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
    dlg.querySelector('.dlg-x').addEventListener('click', () => close(null));
    dlg.querySelectorAll('.dlg-foot button').forEach((btn) => btn.addEventListener('click', () => {
      const b = buttons[Number(btn.dataset.i)];
      if (b.onClick) { b.onClick(close, dlg); return; }
      close(b.value);
    }));
    dlg.addEventListener('submit', (e) => e.preventDefault());
    dlg.showModal();
    if (onMount) onMount(dlg, close);
    const auto = dlg.querySelector('[autofocus]') || dlg.querySelector('.dlg-foot .primary');
    if (auto) auto.focus();
  });
}

function confirmDialog(message, { title = '请确认', ok = '确定', cancel = '取消', danger = false } = {}) {
  return openDialog({
    title,
    body: `<p class="dlg-msg">${esc(message)}</p>`,
    buttons: [{ label: cancel, value: false }, { label: ok, value: true, kind: danger ? 'danger' : 'primary' }],
  }).then(Boolean);
}

// ---------- 弹出菜单 ----------
function popMenu(anchor, items) {
  document.querySelectorAll('.pop').forEach((p) => p.remove());
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.setAttribute('role', 'menu');
  pop.innerHTML = items.map((it, i) => (it === '-' ? '<hr>' : `<button type="button" role="menuitem" data-i="${i}"${it.disabled ? ' disabled' : ''}>${it.icon ? icon(it.icon, 16) : ''}<span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</button>`)).join('');
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth;
  pop.style.top = `${r.bottom + 6}px`;
  pop.style.left = `${Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8))}px`;
  const off = (e) => {
    if (e.type === 'keydown' && e.key !== 'Escape') return;
    if (e.type === 'pointerdown' && pop.contains(e.target)) return;
    done();
  };
  const done = () => {
    pop.remove();
    document.removeEventListener('pointerdown', off, true);
    document.removeEventListener('keydown', off, true);
  };
  setTimeout(() => {
    document.addEventListener('pointerdown', off, true);
    document.addEventListener('keydown', off, true);
  });
  pop.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-i]');
    if (!btn) return;
    done();
    items[Number(btn.dataset.i)].onClick();
  });
  const first = pop.querySelector('button:not([disabled])');
  if (first) first.focus();
  return done;
}

function debounce(fn, ms) {
  let t = 0;
  const run = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  run.flush = (...args) => { clearTimeout(t); fn(...args); };
  run.cancel = () => clearTimeout(t);
  return run;
}

function timeAgo(ts, now = Date.now()) {
  const s = Math.max(0, Math.round((now - ts) / 1000));
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  const d = new Date(ts);
  const n = new Date(now);
  const pad = (x) => String(x).padStart(2, '0');
  if (d.getFullYear() === n.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

/** 选文件：返回 [{ name, bytes }]；用户取消返回空数组。 */
function pickFiles(accept) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', async () => {
      const files = await Promise.all([...input.files].map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })));
      input.remove();
      resolve(files);
    });
    input.addEventListener('cancel', () => { input.remove(); resolve([]); });
    input.click();
  });
}

async function readDropped(dataTransfer) {
  const files = [...(dataTransfer?.files || [])];
  return Promise.all(files.map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })));
}

return { esc, $, $$, LOGO, icon, typeArt, clearToasts, toast, openDialog, confirmDialog, popMenu, debounce, timeAgo, pickFiles, readDropped };
})();

const __mod_platform = (() => {
// 网页版和桌面版的差别都在这里。桌面版（Electron）的 preload 会在 window 上放一个 seatcardDesktop。
const bridge = typeof window !== 'undefined' ? window.seatcardDesktop || null : null;

const desktop = Boolean(bridge);
const isMac = typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const modKey = isMac ? '⌘' : 'Ctrl';

/**
 * 打印当前页面里 #print-root 的内容（打印样式会把界面藏起来）。
 * 桌面版能知道用户是不是点了取消，返回 true/false；网页版没法知道，按打印了算。
 */
async function printNow({ landscape = false } = {}) {
  if (bridge) return bridge.print({ landscape });
  window.print();
  return true;
}

/** 存成 PDF：桌面版弹出"另存为"，返回保存的路径，取消返回 null。网页版不支持，返回 undefined。 */
async function savePdf(defaultName, { landscape = false } = {}) {
  if (!bridge) return undefined;
  return bridge.savePdf(defaultName, { landscape });
}

/** 桌面版：把全部会议写一份到"自动备份"文件夹（每天一个文件，留 30 天）。 */
async function autoBackup(json) {
  if (!bridge?.autoBackup) return null;
  return bridge.autoBackup(json);
}

/** 保存文件：桌面版弹出"另存为"并返回路径；网页版直接下载，返回文件名。 */
async function saveFile(name, blob) {
  if (bridge) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    return bridge.saveFile(name, bytes);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return name;
}

/** 在文件夹里显示刚保存的文件（只有桌面版有）。 */
function showInFolder(path) {
  if (bridge && path) bridge.showInFolder(path);
}

function openPath(path) {
  if (bridge && path) bridge.openPath(path);
}

/** 桌面版菜单栏里的命令（新建、导入、打印、撤销……）转给界面处理。 */
function onMenu(handler) {
  if (bridge) bridge.onMenu(handler);
}

function setTitle(title) {
  document.title = title ? `${title} - 座次桌签` : '座次桌签';
}

const appVersion = bridge?.version || '';

return { desktop, isMac, modKey, printNow, savePdf, autoBackup, saveFile, showInFolder, openPath, onMenu, setTitle, appVersion };

const __mod_cards = (() => {
// 桌签版式与字号。单位一律为毫米。
//
// 双面桌签的做法：一张纸上下两面，上面一面的字倒过来印，对折立起后两边都是正的。
// 这正是 Word 里最折腾人的一步（"文字旋转不过来""保存以后就没有翻转了"），这里直接画好。

const A4 = { w: 210, h: 297 };

const PRESETS = {
  'a4-fold2': { label: 'A4 横向对折（一页一人，最常用）', faceW: 297, faceH: 105, faces: 2 },
  'a4-fold3': { label: 'A4 三折三角立牌（一页一人）', faceW: 297, faceH: 70, faces: 3 },
  'card-200x100': { label: '台卡插页 200×100（一页一人）', faceW: 200, faceH: 100, faces: 2 },
  'card-180x70': { label: '小号台卡 180×70（一页两人）', faceW: 180, faceH: 70, faces: 2 },
};

/**
 * 计算一页纸怎么摆：每张桌签纸 sheet = faceW × (faceH × faces)，在 A4 竖放或横放里排尽量多张。
 * 返回 { page:{w,h,landscape}, sheet:{w,h}, slots:[{x,y}], faces:[{y,h,flip,blank}] }
 */
function sheetLayout({ faceW, faceH, faces = 2 }) {
  const sheet = { w: faceW, h: faceH * faces };
  const fit = (pw, ph) => Math.floor(pw / sheet.w) * Math.floor(ph / sheet.h);
  const portrait = fit(A4.w, A4.h);
  const landscape = fit(A4.h, A4.w);
  if (!portrait && !landscape) throw new Error(`桌签 ${faceW}×${faceH * faces} 毫米放不进一张 A4 纸`);
  const useLandscape = landscape > portrait;
  const page = useLandscape ? { w: A4.h, h: A4.w, landscape: true } : { w: A4.w, h: A4.h, landscape: false };
  const cols = Math.floor(page.w / sheet.w);
  const rowsN = Math.floor(page.h / sheet.h);
  const offX = (page.w - cols * sheet.w) / 2;
  const offY = (page.h - rowsN * sheet.h) / 2;
  const slots = [];
  for (let r = 0; r < rowsN; r++) for (let c = 0; c < cols; c++) slots.push({ x: offX + c * sheet.w, y: offY + r * sheet.h });
  // 两面：上面倒印、下面正印；三折：第一面倒印、第二面正印、第三面留作底座
  const faceList = [];
  for (let i = 0; i < faces; i++) faceList.push({ y: i * faceH, h: faceH, flip: i === 0, blank: faces === 3 && i === 2 });
  return { page, sheet, slots, faces: faceList };
}

/** 把名单分页：每页放 slots.length 张。 */
function paginate(people, perPage) {
  const pages = [];
  for (let i = 0; i < people.length; i += perPage) pages.push(people.slice(i, i + perPage));
  return pages;
}

/**
 * 名字字号：在宽 boxW、高 boxH 的框里尽量大。
 * measure(text) 返回字号为 1 时文字的宽度（不含字距）；spacing 为字距（em）。
 * 两字名默认加宽字距，看起来和三字名一样匀称；四字以上自动缩小，不会溢出。
 */
function fitFontSize(text, { boxW, boxH, spacing = 0, measure = defaultMeasure }) {
  const n = [...text].length;
  const widthPerSize = measure(text) + spacing * Math.max(n - 1, 0);
  if (widthPerSize <= 0) return boxH;
  return Math.min(boxW / widthPerSize, boxH);
}

/** 没有浏览器时的近似：汉字和全角字符宽 1em，其余 0.55em。 */
function defaultMeasure(text) {
  let w = 0;
  for (const ch of text) w += /[⺀-鿿＀-￯]/.test(ch) ? 1 : 0.55;
  return w;
}

function nameSpacing(name, { widenTwo = true } = {}) {
  return widenTwo && [...name].length === 2 ? 0.8 : 0.08;
}

/** 一面桌签里名字和副标题（职务或单位）的位置和字号。 */
function faceText(person, face, { faceW, sub = 'none', measure = defaultMeasure, widenTwo = true } = {}) {
  const subText = sub === 'title' ? person.title : sub === 'unit' ? person.unit : '';
  const marginX = faceW * 0.08;
  const boxW = faceW - marginX * 2;
  // 名字高度约占一面的一半（A4 对折时约 52 毫米，和常见教程里的 140 号字相当）
  const nameBoxH = face.h * (subText ? 0.42 : 0.5);
  const spacing = nameSpacing(person.name, { widenTwo });
  const nameSize = fitFontSize(person.name, { boxW, boxH: nameBoxH, spacing, measure });
  const out = { name: person.name, nameSize, spacing, sub: subText || '', subSize: 0 };
  if (subText) out.subSize = fitFontSize(subText, { boxW, boxH: face.h * 0.13, spacing: 0.05, measure });
  // 竖直方向：名字和副标题作为一组居中，略微下沉（立起来时视线略高于桌面）
  const gap = subText ? face.h * 0.06 : 0;
  const blockH = nameSize + (subText ? gap + out.subSize : 0);
  const top = (face.h - blockH) / 2 + face.h * 0.02;
  out.nameBaseline = top + nameSize * 0.88;
  out.subBaseline = subText ? top + nameSize + gap + out.subSize * 0.88 : 0;
  return out;
}

return { A4, PRESETS, sheetLayout, paginate, fitFontSize, defaultMeasure, nameSpacing, faceText };

const __mod_render = (() => {
// 生成座次图和桌签的 SVG 字符串。座次图用像素坐标，桌签用毫米坐标（打印时 1:1）。
const { sheetLayout, paginate, faceText, defaultMeasure } = __mod_cards;
const { roleName } = __mod_round;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const FONTS = {
  song: { label: '宋体', css: '"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif' },
  xbs: { label: '小标宋（有则用）', css: '"FZXiaoBiaoSong-B05S","方正小标宋简体","FZXBSJW--GB1-0","STZhongsong","Songti SC","SimSun",serif' },
  hei: { label: '黑体', css: '"PingFang SC","Heiti SC","Microsoft YaHei","SimHei","Noto Sans CJK SC",sans-serif' },
  kai: { label: '楷体', css: '"Kaiti SC","STKaiti","KaiTi","KaiTi_GB2312",serif' },
};

// ---------- 座次图 ----------
const SEAT_W = 104;
const SEAT_H = 66;
const GAP = 12;

// 座位：data-id 供界面点选、拖动互换；selected 时加粗描边
function seatBox(x, y, seat, { showTitle = true, sub = '', badge = '', selectedId = null, guest = false } = {}) {
  const p = seat.person;
  const second = sub || (showTitle ? p.title : '');
  const title = second ? `<text x="${x + SEAT_W / 2}" y="${y + 54}" class="seat-title">${esc(trim(second, 8))}</text>` : '';
  const cls = ['seat', p.id !== undefined && p.id === selectedId ? 'selected' : '', guest ? 'guest' : ''].filter(Boolean).join(' ');
  return `<g class="${cls}" data-name="${esc(p.name)}" data-id="${esc(p.id ?? '')}">
  <rect x="${x}" y="${y}" width="${SEAT_W}" height="${SEAT_H}" rx="8" class="seat-box"/>
  <circle cx="${x + 15}" cy="${y + 15}" r="11" class="seat-badge${guest ? ' guest' : ''}"/>
  <text x="${x + 15}" y="${y + 19.5}" class="seat-rank">${badge || seat.rank + 1}</text>
  <text x="${x + SEAT_W / 2}" y="${y + 37}" class="seat-name">${esc(trim(p.name, 6))}</text>${title}
</g>`;
}

function emptySeat(x, y) {
  return `<g class="seat-empty"><rect x="${x}" y="${y}" width="${SEAT_W}" height="${SEAT_H}" rx="8" class="empty-box"/><text x="${x + SEAT_W / 2}" y="${y + 38}" class="note">空位</text></g>`;
}

function trim(s, n) {
  const a = [...String(s)];
  return a.length > n ? a.slice(0, n - 1).join('') + '…' : a.join('');
}

const CHART_STYLE = `<style>
.seat-box{fill:#fff;stroke:#1f2937;stroke-width:1.4}
.seat.guest .seat-box{fill:#eff6ff}
.seat.selected .seat-box{stroke:#b91c1c;stroke-width:3}
.empty-box{fill:none;stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:4 3}
.round-table{fill:#fdf6e3;stroke:#d6b36a;stroke-width:2}
.seat-badge{fill:#b91c1c}
.seat-badge.guest{fill:#1d4ed8}
.seat-rank{fill:#fff;font:600 12px system-ui,sans-serif;text-anchor:middle}
.seat-name{fill:#111827;font:600 17px "PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
.seat-title{fill:#6b7280;font:11px "PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
.stage{fill:#fef3c7;stroke:#d97706}
.table{fill:#f3f4f6;stroke:#9ca3af}
.label{fill:#374151;font:600 14px "PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
.note{fill:#6b7280;font:12px "PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}
.door{fill:none;stroke:#6b7280;stroke-width:2}
</style>`;

/**
 * mirror=false：从台下（或门口）看；mirror=true：从台上（或背对门口）看。
 */
function chartSvg(layout, { mirror = false, title = '', selectedId = null } = {}) {
  const opts = { selectedId };
  if (layout.kind === 'podium') return podiumSvg(layout, mirror, title, opts);
  if (layout.kind === 'round') return roundSvg(layout, title, opts);
  return facingSvg(layout, mirror, title, opts);
}

function podiumSvg(layout, mirror, title, opts) {
  const maxN = Math.max(1, ...layout.rows.map((r) => r.n));
  const width = Math.max(maxN * (SEAT_W + GAP) - GAP + 80, 420);
  const rowsH = layout.rows.length * (SEAT_H + 26);
  const top = title ? 64 : 34;
  const height = top + 40 + rowsH + 70;
  const parts = [];
  if (title) parts.push(`<text x="${width / 2}" y="30" class="label" style="font-size:20px">${esc(title)}</text>`);
  // 主席台在上方，第一排离台下最近，画在最下面
  parts.push(`<rect x="20" y="${top}" width="${width - 40}" height="${rowsH + 40}" rx="10" class="stage"/>`);
  parts.push(`<text x="${width / 2}" y="${top + 24}" class="label">主席台</text>`);
  layout.rows.forEach((row, r) => {
    const y = top + 36 + (layout.rows.length - 1 - r) * (SEAT_H + 26);
    const rowW = row.n * (SEAT_W + GAP) - GAP;
    const x0 = (width - rowW) / 2;
    const seats = mirror ? [...row.seats].reverse() : row.seats;
    seats.forEach((s, i) => parts.push(seatBox(x0 + i * (SEAT_W + GAP), y, s, opts)));
    if (layout.rows.length > 1) parts.push(`<text x="${x0 - 8}" y="${y + SEAT_H / 2 + 4}" class="note" style="text-anchor:end">第${r + 1}排</text>`);
  });
  const by = top + rowsH + 40 + 30;
  parts.push(`<text x="${width / 2}" y="${by}" class="label">${mirror ? '↓ 本图为从台上往台下看' : '↑ 本图为从台下看主席台'}</text>`);
  parts.push(`<text x="${width / 2}" y="${by + 22}" class="note">${layout.rule === 'left' ? '以左为尊：2 号在 1 号左手（以台上就座者自己的左右为准）' : '以右为尊：2 号在 1 号右手（以台上就座者自己的左右为准）'}</text>`);
  return wrap(width, height, parts.join('\n'));
}

function facingSvg(layout, mirror, title, opts) {
  const xs = [...layout.far, ...layout.near].map((s) => s.x);
  const minX = Math.min(0, ...xs);
  const maxX = Math.max(0, ...xs);
  const span = (maxX - minX + 1) * (SEAT_W + GAP);
  const width = Math.max(span + 120, 460);
  const top = title ? 64 : 30;
  const cx = width / 2;
  const toPx = (x) => cx + (mirror ? -x : x) * (SEAT_W + GAP) - SEAT_W / 2;
  const parts = [];
  if (title) parts.push(`<text x="${cx}" y="30" class="label" style="font-size:20px">${esc(title)}</text>`);
  const farY = top + 26;
  const tableY = farY + SEAT_H + 12;
  const tableH = 46;
  const nearY = tableY + tableH + 12;
  const farLabel = mirror ? '主方（背门）' : '客方（面门）';
  const nearLabel = mirror ? '客方（面门）' : '主方（背门）';
  const farSeats = mirror ? layout.near : layout.far;
  const nearSeats = mirror ? layout.far : layout.near;
  parts.push(`<text x="${cx}" y="${farY - 8}" class="label">${farLabel}</text>`);
  farSeats.forEach((s) => parts.push(seatBox(toPx(s.x), farY, s, { ...opts, guest: s.person.side === 'guest' })));
  parts.push(`<rect x="${cx - span / 2 - 10}" y="${tableY}" width="${span + 20}" height="${tableH}" rx="8" class="table"/>`);
  parts.push(`<text x="${cx}" y="${tableY + tableH / 2 + 5}" class="note">会谈桌</text>`);
  nearSeats.forEach((s) => parts.push(seatBox(toPx(s.x), nearY, s, { ...opts, guest: s.person.side === 'guest' })));
  parts.push(`<text x="${cx}" y="${nearY + SEAT_H + 22}" class="label">${nearLabel}</text>`);
  // 门的弧线向上画 26 像素，要和上面"主方（背门）"几个字留出空隙
  const doorY = nearY + SEAT_H + 72;
  if (mirror) {
    parts.push(`<text x="${cx}" y="${farY - 30}" class="note">门在这一侧（图的上方）</text>`);
  } else {
    parts.push(`<path d="M ${cx - 26} ${doorY} h 52 M ${cx - 26} ${doorY} a 26 26 0 0 1 26 -26" class="door"/>`);
    parts.push(`<text x="${cx}" y="${doorY + 20}" class="note">门（本图为从门口看进去）</text>`);
  }
  const note = layout.alignFirst ? '两方按同一方向排：1 号对 1 号、2 号对 2 号' : '两方各按自己的朝向排：人数为双数时 1 号会错开半个座位';
  parts.push(`<text x="${cx}" y="${doorY + 42}" class="note">${note}</text>`);
  return wrap(width, doorY + 60, parts.join('\n'));
}

function roundSvg(layout, title, opts) {
  const n = layout.n;
  // 座位排在圆周上，半径随人数变大，保证座位不重叠
  const R = Math.max(150, (n * (SEAT_W + 16)) / (2 * Math.PI) + 30);
  const top = title ? 70 : 34;
  const width = 2 * R + SEAT_W + 80;
  const cx = width / 2;
  const cy = top + SEAT_H / 2 + R;
  const parts = [];
  if (title) parts.push(`<text x="${cx}" y="34" class="label" style="font-size:20px">${esc(title)}</text>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="${R - SEAT_H / 2 - 16}" class="round-table"/>`);
  parts.push(`<text x="${cx}" y="${cy - 6}" class="label">${layout.scheme === 'single' ? '主人居中' : '主陪面门 · 副陪背门'}</text>`);
  parts.push(`<text x="${cx}" y="${cy + 16}" class="note">${layout.rule === 'right' ? '以右为尊：主宾在主陪右手' : '以左为尊：主宾在主陪左手'}</text>`);
  for (const s of layout.seats) {
    const a = -Math.PI / 2 + (2 * Math.PI * s.seat) / n;
    const x = cx + R * Math.cos(a) - SEAT_W / 2;
    const y = cy + R * Math.sin(a) - SEAT_H / 2;
    if (!s.person) { parts.push(emptySeat(x, y)); continue; }
    const role = roleName(s.side, s.rank, layout.scheme);
    parts.push(seatBox(x, y, s, { ...opts, showTitle: false, sub: role, badge: s.seat === 0 ? '主' : '', guest: s.side === 'guest' }));
  }
  const doorY = cy + R + SEAT_H / 2 + 34;
  parts.push(`<path d="M ${cx - 26} ${doorY} h 52 M ${cx - 26} ${doorY} a 26 26 0 0 1 26 -26" class="door"/>`);
  parts.push(`<text x="${cx}" y="${doorY + 20}" class="note">门（主位正对门口）</text>`);
  if (layout.overflow) parts.push(`<text x="${cx}" y="${doorY + 40}" class="note" style="fill:#b45309">人数超过设定的每桌人数，已自动加座</text>`);

function wrap(w, h, body) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="PingFang SC, Microsoft YaHei, sans-serif">${CHART_STYLE}<rect width="${w}" height="${h}" fill="#fff"/>${body}</svg>`;
}

// ---------- 桌签 ----------

/**
 * 返回 { page, pages:[svg字符串] }。每页是一张 A4，单位毫米。
 * opts: preset({faceW,faceH,faces}), font(css), bold, color, sub('none'|'title'|'unit'), widenTwo, guides, measure
 */
function cardPages(people, opts) {
  const layout = sheetLayout(opts.preset);
  const { page, sheet, slots, faces } = layout;
  const measure = opts.measure || defaultMeasure;
  const weight = opts.bold ? 700 : 400;
  const pages = paginate(people, slots.length).map((group) => {
    const parts = [];
    group.forEach((person, i) => {
      const { x, y } = slots[i];
      if (opts.guides) parts.push(`<rect x="${x}" y="${y}" width="${sheet.w}" height="${sheet.h}" fill="none" stroke="#c8c8c8" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>`);
      faces.forEach((face, fi) => {
        const fy = y + face.y;
        if (opts.guides && fi > 0) parts.push(`<line x1="${x}" y1="${fy}" x2="${x + sheet.w}" y2="${fy}" stroke="#b0b0b0" stroke-width="0.25" stroke-dasharray="3 2"/>`);
        if (face.blank) return;
        const t = faceText(person, face, { faceW: sheet.w, sub: opts.sub, measure, widenTwo: opts.widenTwo });
        const g = [];
        g.push(spacedText(t.name, x + sheet.w / 2, fy + t.nameBaseline, t.nameSize, t.spacing, measure, opts, weight));
        if (t.sub) g.push(spacedText(t.sub, x + sheet.w / 2, fy + t.subBaseline, t.subSize, 0.05, measure, opts, 400));
        const cx = x + sheet.w / 2;
        const cy = fy + face.h / 2;
        parts.push(face.flip ? `<g transform="rotate(180 ${cx} ${cy})">${g.join('')}</g>` : g.join(''));
      });
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${page.w} ${page.h}" width="${page.w}mm" height="${page.h}mm"><rect width="${page.w}" height="${page.h}" fill="#fff"/>${parts.join('\n')}</svg>`;
  });
  return { page, perPage: slots.length, pages };
}

// 逐字定位，不依赖浏览器对 letter-spacing 的实现，保证居中
function spacedText(text, cx, baseline, size, spacing, measure, opts, weight) {
  const chars = [...text];
  const widths = chars.map((c) => measure(c) * size);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * size * Math.max(chars.length - 1, 0);
  let x = cx - total / 2;
  const out = chars.map((c, i) => {
    const mid = x + widths[i] / 2;
    x += widths[i] + spacing * size;
    return `<text x="${mid.toFixed(2)}" y="${baseline.toFixed(2)}" text-anchor="middle">${esc(c)}</text>`;
  });
  return `<g font-family='${opts.font}' font-size="${size.toFixed(2)}" font-weight="${weight}" fill="${opts.color || '#000'}">${out.join('')}</g>`;
}

return { FONTS, chartSvg, cardPages };
})();

const __mod_history = (() => {
// 撤销和重做：每次改动前存一份会议快照（JSON 字符串），最多留 100 步。
class History {
  constructor(limit = 100) {
    this.limit = limit;
    this.past = [];
    this.future = [];
  }

  /** 改动之前调用，传入改动前的状态。 */
  record(state) {
    const snap = JSON.stringify(state);
    if (this.past[this.past.length - 1] === snap) return;
    this.past.push(snap);
    if (this.past.length > this.limit) this.past.shift();
    this.future = [];
  }

  undo(current) {
    if (!this.past.length) return null;
    this.future.push(JSON.stringify(current));
    return JSON.parse(this.past.pop());
  }

  redo(current) {
    if (!this.future.length) return null;
    this.past.push(JSON.stringify(current));
    return JSON.parse(this.future.pop());
  }

  get canUndo() { return this.past.length > 0; }

  get canRedo() { return this.future.length > 0; }

  clear() {
    this.past = [];
    this.future = [];
  }
}

return { History };
})();

const __mod_importers = (() => {

async function inflateRaw(data) {

  const b = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  let eocd = -1;
  for (let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) {
    if (u32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new ImportError('文件不是有效的 Office 文档（可能已损坏，或是老格式）');
  const count = u16(b, eocd + 10);
  let p = u32(b, eocd + 16);
  const out = {};
  const dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    if (u32(b, p) !== 0x02014b50) throw new ImportError('文件目录损坏');
    const method = u16(b, p + 10);
    const csize = u32(b, p + 20);
    const nameLen = u16(b, p + 28);
    const extraLen = u16(b, p + 30);
    const commentLen = u16(b, p + 32);
    const local = u32(b, p + 42);
    const name = dec.decode(b.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    const lNameLen = u16(b, local + 26);
    const lExtraLen = u16(b, local + 28);
    const start = local + 30 + lNameLen + lExtraLen;
    const raw = b.subarray(start, start + csize);
    if (method === 0) out[name] = raw;
    else if (method === 8) out[name] = await inflateRaw(raw);
  }
  return out;
}

function xmlText(s) {
  return s
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d)))
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&amp;/g, '&');
}

function colIndex(ref) {
  const letters = ref.replace(/\d+/g, '');
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

/** Excel：取第一张有内容的工作表，返回二维文字数组。 */
function xlsxRows(files) {
  const dec = new TextDecoder();
  const read = (name) => (files[name] ? dec.decode(files[name]) : '');
  const shared = [];
  const ss = read('xl/sharedStrings.xml');
  for (const m of ss.matchAll(/<si>([\s\S]*?)<\/si>/g)) {
    // 只取 <t> 里的字，跳过拼音注音 <rPh>
    const body = m[1].replace(/<rPh[\s\S]*?<\/rPh>/g, '');
    shared.push([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((t) => xmlText(t[1])).join(''));
  }
  // 按工作簿里的顺序找工作表
  const wb = read('xl/workbook.xml');
  const rels = read('xl/_rels/workbook.xml.rels');
  const relMap = {};
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
    const id = /Id="([^"]+)"/.exec(m[0]);
    const target = /Target="([^"]+)"/.exec(m[0]);
    if (id && target) relMap[id[1]] = target[1].replace(/^\/?xl\//, '').replace(/^\//, '');
  }
  const sheets = [...wb.matchAll(/<sheet\b[^>]*r:id="([^"]+)"[^>]*\/?>/g)].map((m) => `xl/${relMap[m[1]] || ''}`);
  if (!sheets.length) sheets.push(...Object.keys(files).filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort());
  for (const sheet of sheets) {
    const xml = read(sheet);
    const rows = [];
    for (const r of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)) {
      const row = [];
      let next = 0;
      for (const c of r[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const attrs = c[1];
        const body = c[2] || '';
        const ref = /r="([A-Z]+\d+)"/.exec(attrs);
        const idx = ref ? colIndex(ref[1]) : next;
        const type = (/t="(\w+)"/.exec(attrs) || [])[1];
        let v = '';
        if (type === 'inlineStr') v = [...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((t) => xmlText(t[1])).join('');
        else {
          const raw = (/<v>([\s\S]*?)<\/v>/.exec(body) || [])[1];
          if (raw !== undefined) v = type === 's' ? shared[Number(raw)] ?? '' : xmlText(raw);
        }
        row[idx] = v;
        next = idx + 1;
      }
      rows.push(Array.from(row, (x) => x ?? ''));
    }
    if (rows.some((r) => r.some((x) => String(x).trim()))) return rows;
  }
  return [];
}

/** Word：取第一张至少两行的表格；没有表格就按段落一行一个人。 */
function docxRows(files) {
  const xml = files['word/document.xml'] ? new TextDecoder().decode(files['word/document.xml']) : '';
  if (!xml) throw new ImportError('这个 Word 文件里找不到正文');
  const paraText = (s) => [...s.matchAll(/<w:p\b[\s\S]*?<\/w:p>/g)]
    .map((p) => [...p[0].matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)].map((t) => xmlText(t[1])).join(''))
    .filter((t) => t.trim()).join(' ');
  for (const t of xml.matchAll(/<w:tbl>([\s\S]*?)<\/w:tbl>/g)) {
    const rows = [...t[1].matchAll(/<w:tr\b[\s\S]*?<\/w:tr>/g)].map((tr) => [...tr[0].matchAll(/<w:tc>([\s\S]*?)<\/w:tc>/g)].map((tc) => paraText(tc[1]).trim()));
    if (rows.filter((r) => r.some(Boolean)).length >= 2) return rows;
  }
  return [...xml.matchAll(/<w:p\b[\s\S]*?<\/w:p>/g)]
    .map((p) => [...p[0].matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)].map((t) => xmlText(t[1])).join('').trim())
    .filter(Boolean).map((line) => [line]);
}

/** CSV：自动识别 UTF-8 和 GBK（Excel 在中文 Windows 上默认存 GBK）。 */
function decodeText(bytes) {
  const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  if (b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) return new TextDecoder('utf-8').decode(b.subarray(3));
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(b);
  } catch (e) {
    return new TextDecoder('gbk').decode(b);
  }
}

function csvRows(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function rowsToText(rows) {
  return rows
    .map((r) => r.map((c) => String(c ?? '').replace(/[\t\r\n]+/g, ' ').trim()))
    .filter((r) => r.some(Boolean))
    .map((r) => r.join('\t'))
    .join('\n');
}

/** 统一入口：name 用来判断格式，bytes 为文件内容。返回 { text, from }。 */
async function importFile(name, bytes) {
  const ext = (/\.([a-z0-9]+)$/i.exec(name) || [])[1]?.toLowerCase() || '';
  if (['xls', 'et', 'doc', 'wps'].includes(ext)) {
    throw new ImportError(`".${ext}" 是老格式，读不了。请在 Excel、Word 或 WPS 里"另存为" .xlsx 或 .docx，或者直接把表格复制粘贴进来。`);
  }
  if (ext === 'xlsx' || ext === 'xlsm') return { text: rowsToText(xlsxRows(await readZip(bytes))), from: 'Excel' };
  if (ext === 'docx') return { text: rowsToText(docxRows(await readZip(bytes))), from: 'Word' };
  if (ext === 'csv') return { text: rowsToText(csvRows(decodeText(bytes))), from: 'CSV' };
  if (ext === 'txt' || ext === 'tsv' || ext === '') return { text: decodeText(bytes), from: '文本' };
  throw new ImportError(`不认识".${ext}"格式。支持 Excel（.xlsx）、Word（.docx）、CSV 和 TXT。`);
}

return { ImportError, readZip, xmlText, xlsxRows, docxRows, decodeText, csvRows, rowsToText, importFile };
})();

const __mod_dialogs = (() => {

/** 读文件，读不了时把原因交给 onError。返回文字或 null。 */
async function filesToText(files, onError) {
  const out = [];
  for (const f of files) {
    try {
      out.push((await importFile(f.name, f.bytes)).text);
    } catch (e) {
      onError(`${f.name}：${e.message}`);
    }
  }
  return out.length ? out.join('\n') : null;
}

/**
 * 导入名单：可以粘贴、拖文件进来、选文件；右边实时显示识别结果。
 * 返回 { text, mode:'replace'|'append' }，取消返回 null。
 */
function importDialog({ existing = [], type = 'podium', text = '', files = [] } = {}) {
  const has = existing.length > 0;
  const body = `<div class="imp">
  <div class="imp-in">
    <div class="drop" id="imp-drop">
      ${icon('upload', 26)}
      <div><b>把 Excel、Word 名单文件拖到这里</b><br><span class="muted">或者 <button type="button" class="link" id="imp-pick">选择文件…</button>（.xlsx .docx .csv .txt）</span></div>
    </div>
    <label class="lbl" for="imp-text">也可以直接粘贴：从 Excel 选中"姓名、职务、单位"几列复制，或者从微信、Word 里复制，一行一个人</label>
    <textarea id="imp-text" spellcheck="false" autofocus placeholder="姓名&#9;职务&#9;单位&#10;王建华&#9;副市长&#9;市人民政府&#10;陈  平&#9;局长&#9;市教育局"></textarea>
    <p class="err" id="imp-err" hidden></p>
  </div>
  <div class="imp-out">
    <div class="imp-head"><b>识别结果</b><span id="imp-count" class="muted"></span></div>
    <div class="imp-preview" id="imp-preview"></div>
    <ul class="imp-warn" id="imp-warn"></ul>
    <p class="muted small">认错了列？在名单第一行加上表头，比如"姓名　职务　单位${type === 'podium' ? '' : '　主客'}"，就会按表头认。</p>
  </div>
</div>
${has ? `<div class="imp-mode" role="radiogroup" aria-label="怎么处理现有名单">
  <label><input type="radio" name="imp-mode" value="append" checked> 加在现有 ${existing.length} 人后面<span class="muted">（同名的跳过）</span></label>
  <label><input type="radio" name="imp-mode" value="replace"> 替换现有名单<span class="muted">（拿到了新的完整名单时用）</span></label>
</div>` : ''}`;
  let lastCount = 0;
  return openDialog({
    title: '导入名单',
    className: 'dlg-wide',
    body,
    buttons: [
      { label: '取消', value: null },
      {
        label: '导入', kind: 'primary', id: 'imp-ok',
        onClick: (close, dlg) => {
          if (!lastCount) return;
          const mode = dlg.querySelector('input[name="imp-mode"]:checked')?.value || 'replace';
          close({ text: dlg.querySelector('#imp-text').value, mode });
        },
      },
    ],
    onMount: (dlg) => {
      const ta = dlg.querySelector('#imp-text');
      const err = dlg.querySelector('#imp-err');
      const ok = dlg.querySelector('#imp-ok');
      const showErr = (msg) => { err.hidden = !msg; err.textContent = msg || ''; };
      const names = new Set(existing.map((p) => p.name));
      const update = () => {
        const mode = dlg.querySelector('input[name="imp-mode"]:checked')?.value || 'replace';
        const { people, warnings } = parseRoster(ta.value);
        const skip = (p) => mode === 'append' && names.has(p.name);
        const fresh = people.filter((p) => !skip(p));
        lastCount = fresh.length;
        const showSide = type !== 'podium' || people.some((p) => p.side === 'guest');
        dlg.querySelector('#imp-count').textContent = people.length ? `${people.length} 人${people.length > fresh.length ? `，其中 ${people.length - fresh.length} 人已在名单里` : ''}` : '';
        dlg.querySelector('#imp-preview').innerHTML = people.length
          ? `<table><thead><tr><th>姓名</th><th>职务</th><th>单位</th>${showSide ? '<th>主/客</th>' : ''}</tr></thead><tbody>${people.slice(0, 200).map((p) => `<tr class="${skip(p) ? 'skip' : ''}" title="${skip(p) ? '已在名单里，跳过' : `排序依据：${esc(rankOf(p.title).label)}`}"><td>${esc(p.name)}</td><td>${esc(p.title)}</td><td>${esc(p.unit)}</td>${showSide ? `<td>${p.side === 'guest' ? '<span class="tag guest">客</span>' : '<span class="tag">主</span>'}</td>` : ''}</tr>`).join('')}</tbody></table>`
          : '<div class="imp-empty">粘贴或拖入名单后，这里显示识别出的每个人</div>';
        dlg.querySelector('#imp-warn').innerHTML = warnings.map((w) => `<li>${esc(w)}</li>`).join('');
        ok.textContent = fresh.length ? `导入 ${fresh.length} 人` : '导入';
        ok.disabled = !fresh.length;
      };
      const loadFiles = async (list) => {
        if (!list.length) return;
        showErr('');
        const t = await filesToText(list, showErr);
        if (t !== null) { ta.value = t; update(); }
      };
      ta.value = text;
      ta.addEventListener('input', update);
      dlg.querySelectorAll('input[name="imp-mode"]').forEach((r) => r.addEventListener('change', update));
      dlg.querySelector('#imp-pick').addEventListener('click', async () => loadFiles(await pickFiles(ACCEPT)));
      const drop = dlg.querySelector('#imp-drop');
      dlg.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      dlg.addEventListener('dragleave', (e) => { if (!dlg.contains(e.relatedTarget)) drop.classList.remove('over'); });
      dlg.addEventListener('drop', async (e) => { e.preventDefault(); drop.classList.remove('over'); loadFiles(await readDropped(e.dataTransfer)); });
      update();
      loadFiles(files);
    },
  });
}

/**
 * 打印 / 存 PDF。返回 { what:'cards'|'chart', range:'all'|'changed', target:'print'|'pdf' }。
 * info: { total, changed, printedBefore, cardsDesc, chartDesc, desktop }
 */
function printDialog(info, initial = 'cards') {
  const { total, changed, printedBefore, desktop } = info;
  const preferChanged = printedBefore && changed > 0 && changed < total;
  const body = `<div class="choice">
  <label class="opt"><input type="radio" name="what" value="cards"${initial === 'cards' ? ' checked' : ''}>
    <span><b>桌签</b><span class="muted">${esc(info.cardsDesc)}</span></span></label>
  <div class="opt-sub" id="pr-range"${printedBefore ? '' : ' hidden'}>
    <label><input type="radio" name="range" value="all"${preferChanged ? '' : ' checked'}> 全部 ${total} 人</label>
    <label${changed ? '' : ' class="disabled"'}><input type="radio" name="range" value="changed"${preferChanged ? ' checked' : ''}${changed ? '' : ' disabled'}> 只打新增和改过的${changed ? ` ${changed} 人` : '（都打过了，没有改动）'}</label>
  </div>
  <label class="opt"><input type="radio" name="what" value="chart"${initial === 'chart' ? ' checked' : ''}>
    <span><b>座次图</b><span class="muted">${esc(info.chartDesc)}</span></span></label>
</div>
<p class="tip">${icon('help', 16)}<span>打印机设置里纸张选 <b>A4</b>，缩放选<b>"实际大小"或"100%"</b>，不要选"适合页面"，否则桌签对折后会歪。${desktop ? '' : '要存成 PDF：在打印窗口的"目标打印机"里选"另存为 PDF"。'}</span></p>`;
  const pick = (target) => (close, dlg) => {
    const what = dlg.querySelector('input[name="what"]:checked').value;
    const range = dlg.querySelector('input[name="range"]:checked')?.value || 'all';
    close({ what, range, target });
  };
  const buttons = [{ label: '取消', value: null }];
  if (desktop) buttons.push({ label: '存为 PDF…', onClick: pick('pdf') });
  buttons.push({ label: '打印…', kind: 'primary', onClick: pick('print') });
  return openDialog({
    title: '打印',
    body,
    buttons,
    onMount: (dlg) => {
      const sync = () => {
        const cards = dlg.querySelector('input[name="what"]:checked').value === 'cards';
        dlg.querySelector('#pr-range').classList.toggle('off', !cards);
        dlg.querySelectorAll('#pr-range input').forEach((i) => { i.disabled = !cards || (i.value === 'changed' && !changed); });
      };
      dlg.querySelectorAll('input[name="what"]').forEach((r) => r.addEventListener('change', sync));
      sync();
    },
  });
}

const measureCache = new Map();
function makeMeasure(fontCss, weight) {
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `${weight} 100px ${fontCss}`;
  return (text) => {
    const key = `${fontCss}|${weight}|${text}`;
    if (!measureCache.has(key)) measureCache.set(key, ctx.measureText(text).width / 100);
    return measureCache.get(key);
  };
}

    const fit = svg.getBoundingClientRect().width / Number(svg.getAttribute('width'));

    const next = Math.min(3, Math.max(0.4, Math.round((cur + step * 0.25) * 4) / 4));

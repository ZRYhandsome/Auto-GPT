<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>素账 PlainLedger</title>
  <meta name="description" content="无广告、本地优先、零账号共享的记账工具：导入微信/支付宝官方账单，自动归类，多人分摊结算。">
  <meta name="theme-color" content="#3D5A80">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><b>素账</b><span>PlainLedger</span></div>
      <span class="badge" id="ledgerName">我的账本</span>
      <div class="spacer"></div>
      <span class="small muted" id="storageBadge"></span>
    </header>
    <nav class="nav" id="nav">
      <a href="#/ledger" data-route="ledger"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>账单</a>
      <a href="#/import" data-route="import"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>导入</a>
      <a href="#/add" data-route="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>记一笔</a>
      <a href="#/reports" data-route="reports"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 16V9M11 16V5M16 16v-6"/></svg>报表</a>
      <a href="#/members" data-route="members"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 20c0-2 1.2-3.8 3-4.5"/></svg>分账</a>
      <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-6l2-1.5-2-3.4-2.3.9a8 8 0 0 0-5.2-3L11.6 0h-3.2L8 2a8 8 0 0 0-5.2 3l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 .1 6"/></svg>设置</a>
    </nav>
    <main id="view" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="sheet" hidden></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
